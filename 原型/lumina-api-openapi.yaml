          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - 课程
      summary: 发布公告（教师）
      operationId: create_announcement_api_v1_courses__course_id__announcements_post
      security:
      - HTTPBearer: []
      parameters:
      - name: course_id
        in: path
        required: true
