          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentOut'
                title: Response List Students Api V1 Courses  Course Id  Students
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/courses/{course_id}/announcements:
