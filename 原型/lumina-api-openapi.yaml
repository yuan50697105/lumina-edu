          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
          nullable: true
        duration_minutes:
          type: integer
        questions:
          type: array
          items: { $ref: '#/components/schemas/PaperQuestionOut' }
    SubmitIn:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items:
            type: object
            required: [question_id]
            properties:
              question_id:
                type: string
                format: uuid
              answer:
                type: array
                items: { type: string }
                description: 单选/判断单元素；多选多元素；主观题首元素为文本
    ManualGradeIn:
      type: object
      required: [question_id, score]
      properties:
        question_id:
          type: string
          format: uuid
        score:
          type: number
          minimum: 0
    AttemptOut:
      type: object
      required: [id, paper_id, student_id, status]
      properties:
        id:
          type: string
          format: uuid
        paper_id:
          type: string
          format: uuid
        paper_title:
          type: string
        course_id:
          type: string
          format: uuid
        student_id:
          type: string
          format: uuid
        student_name:
          type: string
        status:
          type: string
          enum: [in_progress, submitted]
        started_at:
          type: string
          format: date-time
        submitted_at:
          type: string
          format: date-time
          nullable: true
        auto_score:
          type: number
        manual_score:
          type: number
        total_score:
          type: number
        answers:
          type: array
          items:
            type: object
            properties:
              question_id:
                type: string
                format: uuid
              answer:
                type: array
                items: { type: string }
              correct:
                type: boolean
                nullable: true
                description: 主观题待评分时为 null
              score:
                type: number
              manual:
                type: boolean
                default: false
    StatsOut:
      type: object
      required: [submitted_count, average_score, highest_score, lowest_score]
      properties:
        paper_id:
          type: string
          format: uuid
        submitted_count:
          type: integer
        average_score:
          type: number
        highest_score:
          type: number
        lowest_score:
          type: number
        question_stats:
          type: array
          items:
            type: object
            properties:
              question_id:
                type: string
                format: uuid
              title:
                type: string
              qtype:
                type: string
              score:
                type: number
              correct_count:
                type: integer
              submit_count:
                type: integer
              accuracy:
                type: number
                description: 客观题正确率
              manual_average:
                type: number
                description: 主观题人工均分（未评分则按 0 计）
