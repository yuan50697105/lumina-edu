<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lumina · 17 · 管理端 · Tablet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..900;1,9..144,300..900;0..100&family=Inter:wght@300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ricepaper:#FAF6EC; --ricepaper-2:#F2EBD8; --inkwell:#0F1020; --inkwell-2:#2A2B3D;
    --cobalt:#3D46C9; --cobalt-soft:#E8EAFB; --highlighter:#F5B800; --highlighter-soft:#FDE68A;
    --correction:#E85D3A; --correction-soft:#FDE0D4; --growth:#2A7F4F; --growth-soft:#D4EDDC;
    --line:rgba(15,16,32,0.12); --line-strong:rgba(15,16,32,0.22);
    --shadow:0 1px 2px rgba(15,16,32,0.04), 0 8px 24px rgba(15,16,32,0.06);
    --f-display:"Fraunces", "Songti SC", serif;
    --f-body:"Inter", "PingFang SC", system-ui, sans-serif;
    --f-mono:"JetBrains Mono", ui-monospace, monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--ricepaper); color:var(--inkwell); font-family:var(--f-body); font-size:15px; line-height:1.5;}
  body{padding:48px 56px;}

  .page-header{display:flex; justify-content:space-between; align-items:baseline; padding-bottom:32px; border-bottom:1px solid var(--line); margin-bottom:48px;}
  .page-header h1{font-family:var(--f-display); font-weight:380; font-size:48px; letter-spacing:-0.02em;}
  .page-header h1 em{font-style:italic; color:var(--cobalt);}
  .page-header .meta{font-family:var(--f-mono); font-size:11px; color:var(--inkwell-2); text-transform:uppercase; letter-spacing:0.14em;}

  .section{margin-bottom:60px;}
  .section-title{font-family:var(--f-mono); font-size:12px; text-transform:uppercase; letter-spacing:0.14em; color:var(--inkwell-2); margin-bottom:24px; padding-bottom:12px; border-bottom:1px solid var(--line);}
  .section-desc{font-size:14px; color:var(--inkwell-2); margin:-12px 0 20px; max-width:720px;}

  .phones-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:32px;}
  .phone-col{display:flex; flex-direction:column; gap:12px;}
  .phone-col .label{font-family:var(--f-mono); font-size:11px; text-transform:uppercase; letter-spacing:0.14em; color:var(--inkwell-2);}
  .phone-col .label .tag{color:var(--correction); margin-left:8px; font-weight:500;}

  .phone{background:var(--inkwell); border-radius:36px; padding:12px; box-shadow:var(--shadow); width:100%; max-width:320px; margin:0 auto;}
  .phone-screen{background:var(--ricepaper); border-radius:26px; overflow:hidden; aspect-ratio:9/19.5; display:flex; flex-direction:column; position:relative;}
  .phone-notch{position:absolute; top:8px; left:50%; transform:translateX(-50%); width:90px; height:24px; background:var(--inkwell); border-radius:16px; z-index:5;}
  .phone-status{display:flex; justify-content:space-between; padding:14px 22px 0; font-family:var(--f-mono); font-size:10px; font-weight:500; position:relative; z-index:2;}
  .phone-status .icons{display:flex; gap:3px;}
  .phone-status .icons svg{width:14px; height:14px;}

  /* Admin mobile top bar */
  .adm-topbar{background:var(--inkwell); color:var(--ricepaper); padding:8px 16px 14px; display:flex; align-items:center; gap:10px;}
  .adm-topbar .brand{display:flex; align-items:center; gap:8px; flex:1;}
  .adm-topbar .brand .logo{width:24px; height:24px; border-radius:5px; background:var(--highlighter); color:var(--inkwell); display:flex; align-items:center; justify-content:center; font-family:var(--f-display); font-weight:500; font-style:italic; font-size:13px;}
  .adm-topbar .brand .name{font-family:var(--f-display); font-size:13px; font-weight:400;}
  .adm-topbar .brand .tag{font-family:var(--f-mono); font-size:8px; text-transform:uppercase; letter-spacing:0.12em; background:var(--correction); color:#fff; padding:1px 5px; border-radius:3px; margin-left:4px;}
  .adm-topbar .icon-btn{width:26px; height:26px; border-radius:50%; background:rgba(255,255,255,0.08); display:flex; align-items:center; justify-content:center; position:relative;}
  .adm-topbar .icon-btn svg{width:13px; height:13px; fill:none; stroke:var(--ricepaper); stroke-width:1.8;}
  .adm-topbar .icon-btn .badge{position:absolute; top:-3px; right:-3px; width:12px; height:12px; border-radius:50%; background:var(--correction); color:#fff; font-size:7px; font-family:var(--f-mono); font-weight:600; display:flex; align-items:center; justify-content:center; border:1.5px solid var(--inkwell);}

  .m-body{flex:1; overflow:hidden; display:flex; flex-direction:column;}
  .m-body .scroll{flex:1; overflow-y:auto; padding:12px 14px;}
  .m-body .scroll::-webkit-scrollbar{display:none;}

  .m-nav{display:grid; grid-template-columns:repeat(5, 1fr); background:#fff; border-top:1px solid var(--line); padding:8px 0 6px;}
  .m-nav .item{display:flex; flex-direction:column; align-items:center; gap:2px;}
  .m-nav .item svg{width:17px; height:17px; fill:none; stroke:var(--inkwell-2); stroke-width:1.6;}
  .m-nav .item span{font-size:9px; color:var(--inkwell-2);}
  .m-nav .item.active svg{stroke:var(--inkwell);}
  .m-nav .item.active span{color:var(--inkwell); font-weight:500;}
  .m-nav .item .badge{position:relative; top:-2px; right:-2px; width:12px; height:12px; border-radius:50%; background:var(--correction); color:#fff; font-size:7px; font-family:var(--f-mono); display:flex; align-items:center; justify-content:center;}

  .m-card{background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:8px;}
  .m-card h5{font-family:var(--f-mono); font-size:9px; text-transform:uppercase; letter-spacing:0.12em; color:var(--inkwell-2); margin-bottom:6px; font-weight:500;}
  .m-card.dark{background:var(--inkwell); color:#fff; border-color:var(--inkwell);}
  .m-card.dark h5{color:rgba(255,255,255,0.6);}
  .m-card.hl{background:var(--highlighter-soft); border-color:var(--highlighter);}
  .m-card.growth{background:var(--growth-soft); border-color:var(--growth);}
  .m-card.warn{background:var(--correction-soft); border-color:var(--correction);}

  .m-head{padding:8px 16px 10px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--line); background:#fff;}
  .m-head .title{font-family:var(--f-display); font-size:16px; font-weight:400; letter-spacing:-0.01em; flex:1;}
  .m-head .back{width:26px; height:26px; border-radius:50%; background:var(--ricepaper); border:1px solid var(--line); display:flex; align-items:center; justify-content:center;}
  .m-head .back svg{width:12px; height:12px; fill:none; stroke:var(--inkwell); stroke-width:2;}

  .scr-head{padding:8px 16px 12px; display:flex; align-items:center; gap:10px;}
  .scr-head .back{width:28px; height:28px; border-radius:50%; background:#fff; border:1px solid var(--line); display:flex; align-items:center; justify-content:center;}
  .scr-head .back svg{width:14px; height:14px; fill:none; stroke:var(--inkwell); stroke-width:2;}
  .scr-head .title{font-family:var(--f-display); font-size:18px; font-weight:400; letter-spacing:-0.01em; flex:1;}

  /* Mobile stats */
  .m-stats{display:grid; grid-template-columns:repeat(2, 1fr); gap:8px; margin-bottom:10px;}
  .m-stat{background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px;}
  .m-stat .lbl{font-family:var(--f-mono); font-size:8px; text-transform:uppercase; letter-spacing:0.12em; color:var(--inkwell-2);}
  .m-stat .val{font-family:var(--f-display); font-size:22px; font-weight:400; letter-spacing:-0.01em; line-height:1.1; margin-top:2px;}
  .m-stat .delta{font-family:var(--f-mono); font-size:9px; color:var(--growth); margin-top:2px;}
  .m-stat.warn .val{color:var(--correction);}
  .m-stat.hl{background:var(--highlighter-soft); border-color:var(--highlighter);}
  .m-stat.grow{background:var(--growth-soft); border-color:var(--growth);}
  .m-stat.warn{background:var(--correction-soft); border-color:var(--correction);}

  /* Quick action grid */
  .m-quick{display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; margin-bottom:10px;}
  .m-quick .qa{background:#fff; border:1px solid var(--line); border-radius:8px; padding:8px 4px; text-align:center; cursor:pointer;}
  .m-quick .qa svg{width:18px; height:18px; fill:none; stroke:var(--inkwell); stroke-width:1.7; margin:0 auto 4px; display:block;}
  .m-quick .qa span{font-size:9px; display:block;}
  .m-quick .qa .count{display:block; font-family:var(--f-mono); font-size:9px; color:var(--correction); font-weight:600; margin-top:2px;}
  .m-quick .qa.alert{background:var(--correction-soft); border-color:var(--correction);}
  .m-quick .qa.alert svg{stroke:var(--correction);}

  /* Live alert */
  .alert-strip{
    background:var(--correction); color:#fff; padding:10px 14px; display:flex; gap:10px; align-items:flex-start; margin-bottom:10px; border-radius:10px;
  }
  .alert-strip svg{width:18px; height:18px; fill:none; stroke:#fff; stroke-width:2; flex-shrink:0; margin-top:1px;}
  .alert-strip .content{flex:1; font-size:11px; line-height:1.4;}
  .alert-strip .title{font-weight:600; margin-bottom:2px;}
  .alert-strip .time{font-size:9px; opacity:0.85; font-family:var(--f-mono); margin-top:4px;}

  /* Approval card mobile */
  .adm-approval{background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:8px;}
  .adm-approval .head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px;}
  .adm-approval .title{font-family:var(--f-display); font-size:14px; font-weight:400; line-height:1.3; flex:1;}
  .adm-approval .pill{padding:2px 7px; border-radius:6px; font-size:9px; font-weight:500; background:var(--highlighter-soft); color:#8A6500;}
  .adm-approval .pill.approved{background:var(--growth-soft); color:var(--growth);}
  .adm-approval .pill.rejected{background:var(--correction-soft); color:var(--correction);}
  .adm-approval .meta{font-size:10px; color:var(--inkwell-2); font-family:var(--f-mono); margin-bottom:8px; display:flex; gap:8px; flex-wrap:wrap;}
  .adm-approval .desc{font-size:11px; line-height:1.5; padding:8px; background:var(--ricepaper); border-radius:6px; margin-bottom:10px; color:var(--inkwell-2);}
  .adm-approval .submitter{display:flex; align-items:center; gap:8px; font-size:10px; margin-bottom:10px;}
  .adm-approval .submitter .av{width:22px; height:22px; border-radius:50%; background:var(--cobalt); color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--f-display); font-size:9px;}
  .adm-approval .actions{display:flex; gap:6px;}
  .adm-approval .actions button{flex:1; padding:7px; border-radius:6px; font-size:11px; font-weight:500; cursor:pointer; border:1px solid var(--line); background:#fff;}
  .adm-approval .actions button.approve{background:var(--growth); color:#fff; border-color:var(--growth);}
  .adm-approval .actions button.reject{background:#fff; color:var(--correction); border-color:var(--correction);}

  /* Notification list */
  .notif-item{display:flex; gap:10px; padding:10px; background:#fff; border:1px solid var(--line); border-radius:10px; margin-bottom:6px; align-items:flex-start;}
  .notif-item.unread{background:var(--cobalt-soft); border-color:var(--cobalt);}
  .notif-item.urgent{background:var(--correction-soft); border-color:var(--correction);}
  .notif-item .icon{
    width:32px; height:32px; border-radius:8px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .notif-item .icon svg{width:16px; height:16px; fill:none; stroke-width:2;}
  .notif-item .icon.warn{background:var(--correction); }
  .notif-item .icon.warn svg{stroke:#fff;}
  .notif-item .icon.ok{background:var(--growth);}
  .notif-item .icon.ok svg{stroke:#fff;}
  .notif-item .icon.info{background:var(--cobalt);}
  .notif-item .icon.info svg{stroke:#fff;}
  .notif-item .icon.sys{background:var(--inkwell);}
  .notif-item .icon.sys svg{stroke:var(--highlighter);}
  .notif-item .content{flex:1; min-width:0;}
  .notif-item .title{font-size:12px; font-weight:500; line-height:1.3; margin-bottom:2px;}
  .notif-item .desc{font-size:10px; color:var(--inkwell-2); line-height:1.4;}
  .notif-item .time{font-family:var(--f-mono); font-size:9px; color:var(--inkwell-2); margin-top:4px;}

  /* User card mobile */
  .user-card{background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:8px; display:flex; gap:10px; align-items:center;}
  .user-card .av{width:36px; height:36px; border-radius:50%; background:var(--cobalt); color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--f-display); font-size:14px; flex-shrink:0;}
  .user-card .av.warn{background:var(--correction);}
  .user-card .info{flex:1; min-width:0;}
  .user-card .name{font-size:13px; font-weight:500; display:flex; gap:6px; align-items:center;}
  .user-card .name .pill{font-size:8px; padding:1px 5px; border-radius:4px; font-weight:600;}
  .user-card .name .pill.warn{background:var(--correction-soft); color:var(--correction);}
  .user-card .meta{font-size:10px; color:var(--inkwell-2); font-family:var(--f-mono); margin-top:2px;}
  .user-card .act{width:28px; height:28px; border-radius:50%; background:var(--ricepaper); border:1px solid var(--line); display:flex; align-items:center; justify-content:center;}
  .user-card .act svg{width:12px; height:12px; fill:none; stroke:var(--inkwell-2); stroke-width:2;}

  .m-search{
    background:#fff; border:1px solid var(--line); border-radius:10px; padding:8px 12px; display:flex; align-items:center; gap:8px; margin-bottom:10px;
  }
  .m-search svg{width:14px; height:14px; fill:none; stroke:var(--inkwell-2); stroke-width:1.8;}
  .m-search input{flex:1; border:none; outline:none; font-size:12px; background:transparent; font-family:var(--f-body);}
</style>
<div class="device-label">
  <span>Tablet APP · 自适应布局</span>
  <span class="tag">iPad · 768×1024</span>
</div>

<div style="font-family:var(--f-mono); font-size:11px; text-transform:uppercase; letter-spacing:0.14em; color:var(--inkwell-2); margin-bottom:14px; display:flex; justify-content:space-between;">
    <span>Admin Console · Tablet APP · 自适应布局</span>
    <span style="color:var(--cobalt);">iPad · 768×1024 · 双模式</span>
  </div>

<div style="margin-top:32px; padding:16px; background:var(--cobalt-soft); border:1px solid var(--cobalt); border-radius:10px;">
  <div style="font-family:var(--f-mono); font-size:11px; color:var(--cobalt); text-transform:uppercase; letter-spacing:0.12em; margin-bottom:8px;">✨ 平板布局特点</div>
  <div style="font-size:12px; line-height:1.7;">
    ✓ 三栏布局：导航 + 主内容 + AI 面板<br/>
    ✓ 侧边导航代替底部 Tab<br/>
    ✓ 双列/多列网格展示更多信息<br/>
    ✓ 利用大屏展示图表和 AI 助手<br/>
    <b>响应式断点</b>：≥ 768px 自动切换平板模式
  </div>
</div>

</body>
</html>
