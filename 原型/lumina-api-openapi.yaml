          type: string
          format: uuid
          title: Course Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnouncementCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnouncementOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/courses/{course_id}/student-groups:
    get:
      tags:
      - 课程
      summary: 教学分组列表
      operationId: list_student_groups_api_v1_courses__course_id__student_groups_get
      security:
      - HTTPBearer: []
      parameters:
      - name: course_id
