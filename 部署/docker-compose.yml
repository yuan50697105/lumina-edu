# ============================================
# Lumina 墨光 · 单体应用部署配置
# 合并 9 微服务为单一 FastAPI 应用
# ============================================

services:
  # ───── 数据库 ─────
  postgres:
    image: postgres:16-alpine
    container_name: lumina-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lumina
      POSTGRES_USER: lumina
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumina_secure_password}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumina"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ───── Redis（缓存 + 会话）─────
  redis:
    image: redis:7-alpine
    container_name: lumina-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ───── 单体应用（合并 9 微服务）─────
  lumina-app:
    build:
      context: ../服务/lumina-app
      dockerfile: Dockerfile
    container_name: lumina-app
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://lumina:${POSTGRES_PASSWORD:-lumina_secure_password}@postgres:5432/lumina
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_me_jwt_secret_key}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LOG_LEVEL: INFO
      AI_GATEWAY_URL: http://localhost:8080
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ───── Nginx 反向代理 ─────
  nginx:
    image: nginx:1.25-alpine
    container_name: lumina-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../部署/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../部署/nginx/ssl:/etc/nginx/ssl:ro
      - ../前端/Web/dist:/usr/share/nginx/html:ro
    depends_on:
      - lumina-app

volumes:
  pg_data:
    driver: local
  redis_data:
    driver: local
