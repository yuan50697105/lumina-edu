          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/courses/{course_id}/students:
    get:
      tags:
      - 课程
      summary: 选课学生列表（教师）
      operationId: list_students_api_v1_courses__course_id__students_get
      security:
      - HTTPBearer: []
      parameters:
      - name: course_id
        in: path
