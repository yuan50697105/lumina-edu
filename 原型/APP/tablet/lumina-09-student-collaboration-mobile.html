<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lumina · 09 · 学生协作场景 · 平板端</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..900;1,9..144,300..900;0..100&family=Inter:wght@300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ricepaper:#FAF6EC; --ricepaper-2:#F2EBD8; --inkwell:#0F1020; --inkwell-2:#2A2B3D;
    --cobalt:#3D46C9; --cobalt-soft:#E8EAFB; --highlighter:#F5B800; --highlighter-soft:#FDE68A;
    --correction:#E85D3A; --correction-soft:#FDE0D4; --growth:#2A7F4F; --growth-soft:#D4EDDC;
    --line:rgba(15,16,32,0.12); --line-strong:rgba(15,16,32,0.22);
    --shadow:0 1px 2px rgba(15,16,32,0.04), 0 8px 24px rgba(15,16,32,0.06);
    --f-display:"Fraunces", "Songti SC", serif;
    --f-body:"Inter", "PingFang SC", system-ui, sans-serif;
    --f-mono:"JetBrains Mono", ui-monospace, monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--ricepaper); color:var(--inkwell); font-family:var(--f-body); font-size:15px; line-height:1.5;}
  body{padding:48px 56px;}

  .page-header{display:flex; justify-content:space-between; align-items:baseline; padding-bottom:32px; border-bottom:1px solid var(--line); margin-bottom:48px;}
  .page-header h1{font-family:var(--f-display); font-weight:380; font-size:48px; letter-spacing:-0.02em;}
  .page-header h1 em{font-style:italic; color:var(--cobalt);}
  .page-header .meta{font-family:var(--f-mono); font-size:11px; color:var(--inkwell-2); text-transform:uppercase; letter-spacing:0.14em;}

  .section{margin-bottom:60px;}
  .section-title{font-family:var(--f-mono); font-size:12px; text-transform:uppercase; letter-spacing:0.14em; color:var(--inkwell-2); margin-bottom:24px; padding-bottom:12px; border-bottom:1px solid var(--line);}
  .section-desc{font-size:14px; color:var(--inkwell-2); margin:-12px 0 20px; max-width:720px;}

  .phones-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:32px;}
  .phone-col{display:flex; flex-direction:column; gap:12px;}
  .phone-col .label{font-family:var(--f-mono); font-size:11px; text-transform:uppercase; letter-spacing:0.14em; color:var(--inkwell-2);}
  .phone-col .label .tag{color:var(--cobalt); margin-left:8px;}

  .phone{
    background:var(--inkwell); border-radius:36px; padding:12px;
    box-shadow:var(--shadow); width:100%; max-width:320px; margin:0 auto;
  }
  .phone-screen{
    background:var(--ricepaper); border-radius:26px; overflow:hidden;
    aspect-ratio:9/19.5; display:flex; flex-direction:column; position:relative;
  }
  .phone-notch{
    position:absolute; top:8px; left:50%; transform:translateX(-50%);
    width:90px; height:24px; background:var(--inkwell); border-radius:16px; z-index:5;
  }
  .phone-status{
    display:flex; justify-content:space-between; padding:14px 22px 0;
    font-family:var(--f-mono); font-size:10px; font-weight:500; position:relative; z-index:2;
  }
  .phone-status .icons{display:flex; gap:3px;}
  .phone-status .icons svg{width:14px; height:14px;}

  /* Screen header */
  .scr-head{padding:8px 16px 12px; display:flex; align-items:center; gap:10px;}
  .scr-head .back{
    width:28px; height:28px; border-radius:50%; background:#fff; border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
  }
  .scr-head .back svg{width:14px; height:14px; fill:none; stroke:var(--inkwell); stroke-width:2;}
  .scr-head .title{font-family:var(--f-display); font-size:18px; font-weight:400; letter-spacing:-0.01em;}
  .scr-head .actions{margin-left:auto; display:flex; gap:6px;}
  .scr-head .actions .btn{
    width:28px; height:28px; border-radius:50%; background:#fff; border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
  }
  .scr-head .actions svg{width:14px; height:14px; fill:none; stroke:var(--inkwell-2); stroke-width:1.8;}

  /* Body */
  .m-body{flex:1; overflow:hidden; display:flex; flex-direction:column;}
  .m-body .scroll{flex:1; overflow-y:auto; padding:0 14px 10px;}
  .m-body .scroll::-webkit-scrollbar{display:none;}

  /* Bottom nav */
  .m-nav{
    display:grid; grid-template-columns:repeat(5, 1fr);
    background:#fff; border-top:1px solid var(--line); padding:8px 0 6px;
  }
  .m-nav .item{display:flex; flex-direction:column; align-items:center; gap:2px;}
  .m-nav .item svg{width:17px; height:17px; fill:none; stroke:var(--inkwell-2); stroke-width:1.6;}
  .m-nav .item span{font-size:9px; color:var(--inkwell-2);}
  .m-nav .item.active svg{stroke:var(--cobalt);}
  .m-nav .item.active span{color:var(--cobalt); font-weight:500;}

  /* Cards */
  .m-card{background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:8px;}
  .m-card.cobalt{background:var(--cobalt); color:#fff; border-color:var(--cobalt);}
  .m-card.cobalt .meta, .m-card.cobalt .sub{color:rgba(255,255,255,0.75);}
  .m-card.hl{background:var(--highlighter); border-color:var(--highlighter);}
  .m-card.growth{background:var(--growth-soft); border-color:var(--growth);}
  .m-card.correction{background:var(--correction-soft); border-color:var(--correction);}
  .m-card h5{font-family:var(--f-mono); font-size:10px; text-transform:uppercase; letter-spacing:0.12em; color:var(--inkwell-2); margin-bottom:6px; font-weight:500;}
  .m-card.cobalt h5{color:rgba(255,255,255,0.7);}

  /* ====== LIVE CLASSROOM ====== */
  .live-video{
    aspect-ratio:16/9; background:linear-gradient(135deg, #1A1B2E 0%, #0F1020 100%);
    border-radius:10px; position:relative; overflow:hidden; margin-bottom:10px;
    display:flex; align-items:center; justify-content:center;
  }
  .live-video .placeholder{
    color:rgba(255,255,255,0.4); font-family:var(--f-mono); font-size:10px; text-transform:uppercase; letter-spacing:0.1em;
  }
  .live-video .badge{
    position:absolute; top:8px; left:8px; display:flex; gap:4px;
  }
  .live-video .badge .live{
    background:var(--correction); color:#fff; font-family:var(--f-mono); font-size:9px;
    font-weight:600; padding:2px 6px; border-radius:4px; letter-spacing:0.1em;
    display:flex; align-items:center; gap:4px;
  }
  .live-video .badge .live .dot{width:5px; height:5px; border-radius:50%; background:#fff;}
  .live-video .badge .viewers{
    background:rgba(0,0,0,0.5); color:#fff; font-family:var(--f-mono); font-size:9px;
    padding:2px 6px; border-radius:4px;
  }
  .live-video .teacher-cam{
    position:absolute; bottom:8px; right:8px; width:60px; height:45px;
    background:var(--cobalt); border-radius:6px; border:2px solid rgba(255,255,255,0.3);
    display:flex; align-items:center; justify-content:center; color:#fff;
    font-family:var(--f-display); font-size:14px;
  }
  .live-video .duration{
    position:absolute; top:8px; right:8px; background:rgba(0,0,0,0.5); color:#fff;
    font-family:var(--f-mono); font-size:9px; padding:2px 6px; border-radius:4px;
  }

  .live-controls{
    display:flex; justify-content:space-around; padding:10px 0;
    background:#fff; border-radius:10px; border:1px solid var(--line); margin-bottom:10px;
  }
  .live-controls .ctrl{
    display:flex; flex-direction:column; align-items:center; gap:3px; font-size:9px; color:var(--inkwell-2);
  }
  .live-controls .ctrl .ic{
    width:32px; height:32px; border-radius:50%; background:var(--ricepaper);
    display:flex; align-items:center; justify-content:center;
  }
  .live-controls .ctrl .ic svg{width:15px; height:15px; fill:none; stroke:var(--inkwell); stroke-width:1.7;}
  .live-controls .ctrl.end .ic{background:var(--correction);}
  .live-controls .ctrl.end .ic svg{stroke:#fff;}
  .live-controls .ctrl.raise .ic{background:var(--highlighter);}
  .live-controls .ctrl.raise .ic svg{stroke:var(--inkwell);}

  .chat-msg{
    display:flex; gap:8px; padding:6px 0; border-bottom:1px dashed var(--line); font-size:11px;
  }
  .chat-msg:last-child{border-bottom:none;}
  .chat-msg .av{
    width:20px; height:20px; border-radius:50%; background:var(--cobalt); color:#fff;
    display:flex; align-items:center; justify-content:center; font-family:var(--f-display);
    font-size:9px; flex-shrink:0;
  }
  .chat-msg .name{font-weight:500; margin-right:4px;}
  .chat-msg .text{color:var(--inkwell-2); line-height:1.4;}

  /* ====== GROUP COLLABORATION ====== */
  .group-hero{
    background:linear-gradient(135deg, var(--cobalt) 0%, var(--inkwell) 100%);
    color:#fff; padding:14px 16px; border-radius:12px 12px 0 0;
  }
  .group-hero .tag{font-family:var(--f-mono); font-size:9px; letter-spacing:0.14em; text-transform:uppercase; opacity:0.8;}
  .group-hero .title{font-family:var(--f-display); font-size:20px; font-weight:380; margin-top:4px;}
  .group-hero .members{display:flex; margin-top:10px;}
  .group-hero .members .av{
    width:26px; height:26px; border-radius:50%; border:2px solid #fff;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--f-display); font-size:10px; font-weight:500;
    margin-left:-6px;
  }
  .group-hero .members .av:first-child{margin-left:0;}
  .group-hero .members .av.c1{background:var(--highlighter); color:var(--inkwell);}
  .group-hero .members .av.c2{background:var(--correction);}
  .group-hero .members .av.c3{background:var(--growth);}
  .group-hero .members .av.c4{background:#fff; color:var(--cobalt);}
  .group-hero .members .more{
    width:26px; height:26px; border-radius:50%; border:2px solid #fff; background:rgba(255,255,255,0.2);
    display:flex; align-items:center; justify-content:center; font-size:9px;
    margin-left:-6px; font-family:var(--f-mono);
  }

  .tab-row{display:flex; background:#fff; border-bottom:1px solid var(--line); padding:0 8px;}
  .tab-row .tab{flex:1; text-align:center; padding:9px 4px; font-size:11px; color:var(--inkwell-2); border-bottom:2px solid transparent;}
  .tab-row .tab.active{color:var(--cobalt); border-bottom-color:var(--cobalt); font-weight:500;}

  .task-item{
    display:flex; gap:10px; padding:8px 10px; background:#fff; border:1px solid var(--line);
    border-radius:8px; margin-bottom:6px; align-items:flex-start;
  }
  .task-item .check{
    width:18px; height:18px; border-radius:50%; border:1.5px solid var(--line-strong);
    flex-shrink:0; margin-top:1px; display:flex; align-items:center; justify-content:center;
  }
  .task-item .check.done{background:var(--growth); border-color:var(--growth);}
  .task-item .check.done svg{width:10px; height:10px; fill:none; stroke:#fff; stroke-width:2.5;}
  .task-item .content{flex:1; min-width:0;}
  .task-item .t-title{font-size:12px; font-weight:500;}
  .task-item .t-title.done{text-decoration:line-through; color:var(--inkwell-2);}
  .task-item .t-meta{font-size:10px; color:var(--inkwell-2); font-family:var(--f-mono); margin-top:2px; display:flex; gap:6px; align-items:center;}
  .task-item .t-meta .av-mini{
    width:14px; height:14px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center;
    font-family:var(--f-display); font-size:7px; color:#fff;
  }

  /* ====== LEARNING REPORT ====== */
  .report-hero{
    background:var(--inkwell); color:var(--ricepaper); padding:16px; border-radius:12px;
    position:relative; overflow:hidden; margin-bottom:10px;
  }
  .report-hero .term{font-family:var(--f-mono); font-size:9px; text-transform:uppercase; letter-spacing:0.14em; opacity:0.6;}
  .report-hero .gpa{font-family:var(--f-display); font-size:56px; font-weight:300; letter-spacing:-0.04em; line-height:1; margin:6px 0 4px;}
  .report-hero .gpa em{font-style:italic; color:var(--highlighter);}
  .report-hero .rank{font-size:11px; opacity:0.8;}
  .report-hero .rank strong{color:var(--highlighter);}
  .report-hero .chart{
    position:absolute; right:16px; bottom:16px; width:70px; height:50px;
    display:flex; align-items:flex-end; gap:3px;
  }
  .report-hero .chart .bar{flex:1; background:var(--cobalt); border-radius:2px 2px 0 0;}
  .report-hero .chart .bar.hl{background:var(--highlighter);}

  .stat-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-bottom:10px;}
  .stat-tile{background:#fff; border:1px solid var(--line); border-radius:8px; padding:10px; text-align:center;}
  .stat-tile .val{font-family:var(--f-display); font-size:22px; font-weight:400; letter-spacing:-0.02em;}
  .stat-tile .val.hl{background:linear-gradient(180deg, transparent 62%, var(--highlighter) 62%, var(--highlighter) 88%, transparent 88%); padding:0 4px; display:inline-block;}
  .stat-tile .lbl{font-size:9px; color:var(--inkwell-2); font-family:var(--f-mono); text-transform:uppercase; letter-spacing:0.08em; margin-top:2px;}
  .stat-tile .trend{font-size:9px; font-family:var(--f-mono); margin-top:2px;}
  .stat-tile .trend.up{color:var(--growth);}
  .stat-tile .trend.down{color:var(--correction);}

  .course-row{
    display:flex; align-items:center; gap:10px; padding:10px;
    background:#fff; border:1px solid var(--line); border-radius:8px; margin-bottom:6px;
  }
  .course-row .score{
    font-family:var(--f-display); font-size:18px; font-weight:400;
    min-width:40px; text-align:center;
  }
  .course-row .score.hl{color:var(--growth);}
  .course-row .score.warn{color:var(--correction);}
  .course-row .info{flex:1; min-width:0;}
  .course-row .name{font-size:12px; font-weight:500;}
  .course-row .meta{font-size:10px; color:var(--inkwell-2); font-family:var(--f-mono);}
  .course-row .bar{height:4px; background:var(--ricepaper-2); border-radius:2px; overflow:hidden; margin-top:4px;}
  .course-row .bar .fill{height:100%; background:var(--cobalt); border-radius:2px;}

  /* ====== BADGES / ACHIEVEMENTS ====== */
  .badge-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-bottom:10px;}
  .badge-item{
    background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 6px;
    text-align:center;
  }
  .badge-item .ic{
    width:38px; height:38px; border-radius:50%; margin:0 auto 6px;
    display:flex; align-items:center; justify-content:center; font-size:18px;
  }
  .badge-item .ic.gold{background:var(--highlighter-soft); color:#8A6500;}
  .badge-item .ic.silver{background:var(--ricepaper-2); color:var(--inkwell-2);}
  .badge-item .ic.bronze{background:#F4DCC4; color:#8A5500;}
  .badge-item .ic.locked{background:var(--ricepaper-2); color:var(--inkwell-2); opacity:0.4;}
  .badge-item .n{font-size:10px; font-weight:500; line-height:1.3;}
  .badge-item .d{font-size:8px; color:var(--inkwell-2); font-family:var(--f-mono); margin-top:2px;}

  /* ====== ENROLLMENT ====== */
  .enroll-search{
    background:#fff; border:1px solid var(--line); border-radius:10px;
    padding:8px 10px; display:flex; align-items:center; gap:8px; font-size:12px; color:var(--inkwell-2);
    margin-bottom:10px;
  }
  .enroll-search svg{width:14px; height:14px; fill:none; stroke:var(--inkwell-2); stroke-width:1.8;}

  .filter-chips{display:flex; gap:6px; margin-bottom:10px; overflow-x:auto;}
  .filter-chips::-webkit-scrollbar{display:none;}
  .filter-chips .chip{
    padding:5px 10px; background:#fff; border:1px solid var(--line); border-radius:14px;
    font-size:11px; white-space:nowrap;
  }
  .filter-chips .chip.active{background:var(--cobalt); color:#fff; border-color:var(--cobalt);}

  .course-card-v{
    background:#fff; border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-bottom:8px;
  }
  .course-card-v .cover{
    height:70px; position:relative; display:flex; align-items:flex-end; padding:8px;
    color:#fff; font-family:var(--f-mono); font-size:9px; text-transform:uppercase; letter-spacing:0.1em;
  }
  .course-card-v .cover.c1{background:linear-gradient(135deg, var(--cobalt) 0%, #5A63E0 100%);}
  .course-card-v .cover.c2{background:linear-gradient(135deg, var(--growth) 0%, #3DA06F 100%);}
  .course-card-v .cover.c3{background:linear-gradient(135deg, var(--correction) 0%, #F5803A 100%);}
  .course-card-v .cover.c4{background:linear-gradient(135deg, var(--inkwell) 0%, #2A2B3D 100%);}
  .course-card-v .cover .tag-pill{
    position:absolute; top:8px; right:8px; background:rgba(255,255,255,0.2);
    padding:2px 6px; border-radius:8px; font-size:8px; font-weight:500;
  }
  .course-card-v .body{padding:10px;}
  .course-card-v .name{font-family:var(--f-display); font-size:15px; font-weight:400; letter-spacing:-0.01em; line-height:1.2;}
  .course-card-v .teacher{font-size:10px; color:var(--inkwell-2); font-family:var(--f-mono); margin-top:4px;}
  .course-card-v .foot{
    display:flex; justify-content:space-between; align-items:center; margin-top:8px;
    padding-top:8px; border-top:1px solid var(--line);
  }
  .course-card-v .info{font-size:10px; color:var(--inkwell-2); font-family:var(--f-mono);}
  .course-card-v .enroll-btn{
    padding:5px 12px; background:var(--cobalt); color:#fff; border:none; border-radius:8px;
    font-size:10px; font-weight:500;
  }
  .course-card-v .enroll-btn.full{background:var(--ricepaper-2); color:var(--inkwell-2);}
</style>
<div class="device-label">
  <span>Tablet APP · 自适应布局</span>
  <span class="tag">iPad · 768×1024</span>
</div>

<div style="font-family:var(--f-mono); font-size:11px; text-transform:uppercase; letter-spacing:0.14em; color:var(--inkwell-2); margin-bottom:14px; display:flex; justify-content:space-between;">
    <span>Student Collaboration · Tablet APP · 自适应布局</span>
    <span style="color:var(--cobalt);">iPad · 768×1024 · 双模式</span>
  </div>

<div style="margin-top:32px; padding:16px; background:var(--cobalt-soft); border:1px solid var(--cobalt); border-radius:10px;">
  <div style="font-family:var(--f-mono); font-size:11px; color:var(--cobalt); text-transform:uppercase; letter-spacing:0.12em; margin-bottom:8px;">✨ 平板布局特点</div>
  <div style="font-size:12px; line-height:1.7;">
    ✓ 三栏布局：导航 + 主内容 + AI 面板<br/>
    ✓ 侧边导航代替底部 Tab<br/>
    ✓ 双列/多列网格展示更多信息<br/>
    ✓ 利用大屏展示图表和 AI 助手<br/>
    <b>响应式断点</b>：≥ 768px 自动切换平板模式
  </div>
</div>

</body>
</html>
