          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StudentGroupOut'
                title: Response List Student Groups Api V1 Courses  Course Id  Student
                  Groups Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - 课程
      summary: 创建教学分组（教师）
      operationId: create_student_group_api_v1_courses__course_id__student_groups_post
      security:
      - HTTPBearer: []
      parameters:
      - name: course_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Course Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentGroupCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentGroupOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/courses/{course_id}/student-groups/{group_id}:
    patch:
      tags:
      - 课程
      summary: 更新教学分组
      operationId: update_student_group_api_v1_courses__course_id__student_groups__group_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: course_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Course Id
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Group Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
