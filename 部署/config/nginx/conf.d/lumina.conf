# Lumina 墨光 - API 站点配置
# 静态原型 + API 代理

server {
    listen 80;
    server_name ${DOMAIN};

    # HTTP → HTTPS 重定向
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ${DOMAIN};

    # ─── TLS 配置 ───
    # 证书放在 ../ssl/ 目录
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ─── 静态原型 ───
    root /usr/share/nginx/html;
    index index.html;

    # 原型页面
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── 静态文件缓存 ───
    location ~* \.(html|css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # ─── API 路由（正则按模块拆分，顺序敏感）───
    # 作业相关 → assignment-service:8091
    location ~ ^/api/v1/courses/[^/]+/assignments(/.*)?$ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://assignment-service:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location ~ ^/api/v1/assignments(/.*)?$ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://assignment-service:8091;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 成绩相关 → grade-service:8092
    location ~ ^/api/v1/courses/[^/]+/grades(/.*)?$ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://grade-service:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location ~ ^/api/v1/grades(/.*)?$ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://grade-service:8092;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # AI 相关 → ai-gateway-service:8093（对话/批阅细分在 2.6/2.7 阶段加入）
    location /api/v1/ai/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://ai-gateway-service:8093;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 课程相关 → course-service:8090
    location ~ ^/api/v1/courses(/.*)?$ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://course-service:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 认证/用户 → user-service:8080
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://user-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ─── SSE 流式响应（AI 对话，2.6 独立 ai-chat-service）───
    location /api/v1/ai/chat {
        proxy_pass http://ai-gateway-service:8093;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        charset utf-8;
        add_header X-Accel-Buffering no;
    }

    # ─── OpenAPI 规范 ───
    location ~* \.(yaml|yml)$ {
        add_header Content-Type "application/yaml";
        add_header Access-Control-Allow-Origin "*";
    }

    # ─── 健康检查 ───
    location /health {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }
}