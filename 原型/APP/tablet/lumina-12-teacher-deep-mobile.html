<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lumina · 12 · 教师深度功能 · 平板端</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..900;1,9..144,300..900;0..100&family=Inter:wght@300..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ricepaper:#FAF6EC; --ricepaper-2:#F2EBD8; --inkwell:#0F1020; --inkwell-2:#2A2B3D;
    --cobalt:#3D46C9; --cobalt-soft:#E8EAFB; --highlighter:#F5B800; --highlighter-soft:#FDE68A;
    --correction:#E85D3A; --correction-soft:#FDE0D4; --growth:#2A7F4F; --growth-soft:#D4EDDC;
    --line:rgba(15,16,32,0.12); --line-strong:rgba(15,16,32,0.22);
    --shadow:0 1px 2px rgba(15,16,32,0.04), 0 8px 24px rgba(15,16,32,0.06);
    --f-display:"Fraunces", "Songti SC", serif;
    --f-body:"Inter", "PingFang SC", system-ui, sans-serif;
    --f-mono:"JetBrains Mono", ui-monospace, monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--ricepaper); color:var(--inkwell); font-family:var(--f-body); font-size:15px; line-height:1.5;}
  body{padding:48px 56px;}

  .page-header{display:flex; justify-content:space-between; align-items:baseline; padding-bottom:32px; border-bottom:1px solid var(--line); margin-bottom:48px;}
  .page-header h1{font-family:var(--f-display); font-weight:380; font-size:48px; letter-spacing:-0.02em;}
  .page-header h1 em{font-style:italic; color:var(--cobalt);}
  .page-header .meta{font-family:var(--f-mono); font-size:11px; color:var(--inkwell-2); text-transform:uppercase; letter-spacing:0.14em;}

  .section{margin-bottom:60px;}
  .section-title{font-family:var(--f-mono); font-size:12px; text-transform:uppercase; letter-spacing:0.14em; color:var(--inkwell-2); margin-bottom:24px; padding-bottom:12px; border-bottom:1px solid var(--line);}
  .section-desc{font-size:14px; color:var(--inkwell-2); margin:-12px 0 20px; max-width:720px;}

  .phones-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:32px;}
  .phone-col{display:flex; flex-direction:column; gap:12px;}
  .phone-col .label{font-family:var(--f-mono); font-size:11px; text-transform:uppercase; letter-spacing:0.14em; color:var(--inkwell-2);}
  .phone-col .label .tag{color:var(--cobalt); margin-left:8px;}

  .phone{background:var(--inkwell); border-radius:36px; padding:12px; box-shadow:var(--shadow); width:100%; max-width:320px; margin:0 auto;}
  .phone-screen{background:var(--ricepaper); border-radius:26px; overflow:hidden; aspect-ratio:9/19.5; display:flex; flex-direction:column; position:relative;}
  .phone-notch{position:absolute; top:8px; left:50%; transform:translateX(-50%); width:90px; height:24px; background:var(--inkwell); border-radius:16px; z-index:5;}
  .phone-status{display:flex; justify-content:space-between; padding:14px 22px 0; font-family:var(--f-mono); font-size:10px; font-weight:500; position:relative; z-index:2;}
  .phone-status .icons{display:flex; gap:3px;}
  .phone-status .icons svg{width:14px; height:14px;}

  .scr-head{padding:8px 16px 12px; display:flex; align-items:center; gap:10px;}
  .scr-head .back{width:28px; height:28px; border-radius:50%; background:#fff; border:1px solid var(--line); display:flex; align-items:center; justify-content:center;}
  .scr-head .back svg{width:14px; height:14px; fill:none; stroke:var(--inkwell); stroke-width:2;}
  .scr-head .title{font-family:var(--f-display); font-size:18px; font-weight:400; letter-spacing:-0.01em; flex:1;}
  .scr-head .actions{display:flex; gap:6px;}
  .scr-head .actions .btn{width:28px; height:28px; border-radius:50%; background:#fff; border:1px solid var(--line); display:flex; align-items:center; justify-content:center;}
  .scr-head .actions svg{width:14px; height:14px; fill:none; stroke:var(--inkwell-2); stroke-width:1.8;}

  .m-body{flex:1; overflow:hidden; display:flex; flex-direction:column;}
  .m-body .scroll{flex:1; overflow-y:auto; padding:0 14px 10px;}
  .m-body .scroll::-webkit-scrollbar{display:none;}

  .m-nav{display:grid; grid-template-columns:repeat(5, 1fr); background:#fff; border-top:1px solid var(--line); padding:8px 0 6px;}
  .m-nav .item{display:flex; flex-direction:column; align-items:center; gap:2px;}
  .m-nav .item svg{width:17px; height:17px; fill:none; stroke:var(--inkwell-2); stroke-width:1.6;}
  .m-nav .item span{font-size:9px; color:var(--inkwell-2);}
  .m-nav .item.active svg{stroke:var(--cobalt);}
  .m-nav .item.active span{color:var(--cobalt); font-weight:500;}

  .m-card{background:#fff; border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:8px;}
  .m-card h5{font-family:var(--f-mono); font-size:10px; text-transform:uppercase; letter-spacing:0.12em; color:var(--inkwell-2); margin-bottom:6px; font-weight:500;}
  .m-card.cobalt{background:var(--cobalt); color:#fff; border-color:var(--cobalt);}
  .m-card.cobalt h5, .m-card.cobalt .sub{color:rgba(255,255,255,0.7);}
  .m-card.correction{background:var(--correction-soft); border-color:var(--correction);}
  .m-card.growth{background:var(--growth-soft); border-color:var(--growth);}
  .m-card.hl{background:var(--highlighter-soft); border-color:var(--highlighter);}

  /* Live teaching */
  .teach-video{
    aspect-ratio:16/9; background:linear-gradient(135deg, var(--inkwell) 0%, #2A2B3D 100%);
    border-radius:10px; position:relative; display:flex; align-items:center; justify-content:center;
    color:rgba(255,255,255,0.5); font-family:var(--f-mono); font-size:10px; text-transform:uppercase; letter-spacing:0.1em;
    margin-bottom:10px;
  }
  .teach-video .badge{position:absolute; top:8px; left:8px; display:flex; gap:4px;}
  .teach-video .badge .rec{
    background:var(--correction); color:#fff; font-family:var(--f-mono); font-size:9px; font-weight:600;
    padding:2px 6px; border-radius:4px; display:flex; align-items:center; gap:4px;
  }
  .teach-video .badge .rec .dot{width:5px; height:5px; border-radius:50%; background:#fff; animation: pulse 1.5s infinite;}
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:0.3;}}
  .teach-video .badge .info{background:rgba(0,0,0,0.5); color:#fff; font-family:var(--f-mono); font-size:9px; padding:2px 6px; border-radius:4px;}
  .teach-video .teacher-cam{
    position:absolute; bottom:8px; right:8px; width:56px; height:42px;
    background:var(--cobalt); border:2px solid rgba(255,255,255,0.3); border-radius:6px;
    display:flex; align-items:center; justify-content:center; color:#fff; font-family:var(--f-display); font-size:14px;
  }

  .teach-toolbar{
    display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; margin-bottom:10px;
  }
  .teach-toolbar .tool{
    background:#fff; border:1px solid var(--line); border-radius:8px; padding:8px 4px;
    text-align:center; cursor:pointer;
  }
  .teach-toolbar .tool svg{width:16px; height:16px; fill:none; stroke:var(--inkwell); stroke-width:1.7; margin-bottom:3px; display:block; margin-left:auto; margin-right:auto;}
  .teach-toolbar .tool span{font-size:9px; color:var(--inkwell-2);}
  .teach-toolbar .tool.active{background:var(--cobalt); border-color:var(--cobalt);}
  .teach-toolbar .tool.active svg{stroke:#fff;}
  .teach-toolbar .tool.active span{color:#fff;}
  .teach-toolbar .tool.danger{background:var(--correction-soft); border-color:var(--correction);}

  .student-row{
    display:flex; align-items:center; gap:8px; padding:8px; background:#fff;
    border:1px solid var(--line); border-radius:8px; margin-bottom:6px;
  }
  .student-row .av{width:28px; height:28px; border-radius:50%; background:var(--cobalt); color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--f-display); font-size:11px;}
  .student-row .info{flex:1; min-width:0;}
  .student-row .name{font-size:12px; font-weight:500;}
  .student-row .meta{font-size:10px; color:var(--inkwell-2); font-family:var(--f-mono);}
  .student-row .status-pill{padding:3px 7px; border-radius:8px; font-size:9px; font-weight:500;}
  .student-row .status-pill.hand{background:var(--highlighter-soft); color:#8A6500;}
  .student-row .status-pill.attentive{background:var(--growth-soft); color:var(--growth);}
  .student-row .status-pill.distracted{background:var(--correction-soft); color:var(--correction);}

  /* Analytics */
  .analytics-hero{
    background:var(--inkwell); color:var(--ricepaper); border-radius:12px; padding:14px;
    position:relative; overflow:hidden; margin-bottom:10px;
  }
  .analytics-hero .term{font-family:var(--f-mono); font-size:9px; letter-spacing:0.14em; text-transform:uppercase; opacity:0.6;}
  .analytics-hero .course{font-family:var(--f-display); font-size:20px; font-weight:380; margin-top:2px;}
  .analytics-hero .stats-row{display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-top:12px;}
  .analytics-hero .stat{text-align:center;}
  .analytics-hero .stat .val{font-family:var(--f-display); font-size:22px; font-weight:400;}
  .analytics-hero .stat .val.hl{color:var(--highlighter);}
  .analytics-hero .stat .val.grow{color:var(--growth);}
  .analytics-hero .stat .val.warn{color:var(--correction);}
  .analytics-hero .stat .lbl{font-size:9px; opacity:0.7; font-family:var(--f-mono);}

  .risk-row{
    display:flex; gap:10px; padding:10px; background:#fff; border:1px solid var(--line); border-radius:8px; margin-bottom:6px;
  }
  .risk-row .av{width:32px; height:32px; border-radius:50%; background:var(--cobalt); color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--f-display); font-size:12px;}
  .risk-row .av.warn{background:var(--correction);}
  .risk-row .info{flex:1; min-width:0;}
  .risk-row .name{font-size:12px; font-weight:500; display:flex; gap:6px; align-items:center;}
  .risk-row .name .pill{font-size:8px; padding:1px 5px; border-radius:4px; font-weight:600;}
  .risk-row .name .pill.warn{background:var(--correction-soft); color:var(--correction);}
  .risk-row .name .pill.grow{background:var(--growth-soft); color:var(--growth);}
  .risk-row .meta{font-size:10px; color:var(--inkwell-2); font-family:var(--f-mono); margin-top:2px;}

  /* Question bank */
  .q-type-tabs{display:flex; gap:6px; margin-bottom:10px; overflow-x:auto;}
  .q-type-tabs::-webkit-scrollbar{display:none;}
  .q-type-tabs .chip{padding:5px 10px; background:#fff; border:1px solid var(--line); border-radius:14px; font-size:11px; white-space:nowrap;}
  .q-type-tabs .chip.active{background:var(--cobalt); color:#fff; border-color:var(--cobalt);}

  .q-item{
    background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:8px;
    position:relative;
  }
  .q-item .head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px;}
  .q-item .qtype{font-family:var(--f-mono); font-size:9px; text-transform:uppercase; letter-spacing:0.1em; color:var(--cobalt); background:var(--cobalt-soft); padding:2px 6px; border-radius:6px; font-weight:500;}
  .q-item .qtype.mc{color:#8A6500; background:var(--highlighter-soft);}
  .q-item .qtype.tf{color:var(--growth); background:var(--growth-soft);}
  .q-item .qtype.essay{color:var(--correction); background:var(--correction-soft);}
  .q-item .points{font-family:var(--f-mono); font-size:10px; color:var(--inkwell-2);}
  .q-item .text{font-size:12px; line-height:1.5; margin-bottom:8px;}
  .q-item .meta{display:flex; justify-content:space-between; font-size:10px; color:var(--inkwell-2); font-family:var(--f-mono);}
  .q-item .actions{display:flex; gap:6px; margin-top:8px; padding-top:8px; border-top:1px dashed var(--line);}
  .q-item .actions button{padding:4px 10px; background:var(--ricepaper); border:1px solid var(--line); border-radius:6px; font-size:10px; cursor:pointer; color:var(--inkwell-2);}
  .q-item .actions button.primary{background:var(--cobalt); color:#fff; border-color:var(--cobalt);}

  /* Evaluation */
  .eval-preview{
    background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:10px;
  }
  .eval-preview .head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; padding-bottom:10px; border-bottom:1px solid var(--line);}
  .eval-preview .title{font-family:var(--f-display); font-size:16px; font-weight:400;}
  .eval-preview .status{font-size:10px; padding:3px 8px; border-radius:10px; font-weight:500;}
  .eval-preview .status.open{background:var(--growth-soft); color:var(--growth);}
  .eval-preview .status.closed{background:var(--ricepaper-2); color:var(--inkwell-2);}

  .eval-q{padding:10px 0; border-bottom:1px dashed var(--line);}
  .eval-q:last-child{border-bottom:none;}
  .eval-q .q{font-size:12px; font-weight:500; margin-bottom:6px;}
  .eval-q .a-preview{font-size:10px; color:var(--inkwell-2); font-family:var(--f-mono); margin-bottom:4px;}
  .eval-q .bar-row{display:flex; gap:4px; align-items:center; font-size:10px; margin-bottom:3px;}
  .eval-q .bar-row .lbl{min-width:16px; font-family:var(--f-mono); color:var(--inkwell-2);}
  .eval-q .bar-row .bar{flex:1; height:5px; background:var(--ricepaper-2); border-radius:3px; overflow:hidden;}
  .eval-q .bar-row .bar .fill{height:100%; background:var(--cobalt); border-radius:3px;}
  .eval-q .bar-row .pct{font-family:var(--f-mono); min-width:32px; text-align:right;}
</style>
<div class="device-label">
  <span>Tablet APP · 自适应布局</span>
  <span class="tag">iPad · 768×1024</span>
</div>

<div style="font-family:var(--f-mono); font-size:11px; text-transform:uppercase; letter-spacing:0.14em; color:var(--inkwell-2); margin-bottom:14px; display:flex; justify-content:space-between;">
    <span>Teacher Deep Features · Tablet APP · 自适应布局</span>
    <span style="color:var(--cobalt);">iPad · 768×1024 · 双模式</span>
  </div>

<div style="margin-top:32px; padding:16px; background:var(--cobalt-soft); border:1px solid var(--cobalt); border-radius:10px;">
  <div style="font-family:var(--f-mono); font-size:11px; color:var(--cobalt); text-transform:uppercase; letter-spacing:0.12em; margin-bottom:8px;">✨ 平板布局特点</div>
  <div style="font-size:12px; line-height:1.7;">
    ✓ 三栏布局：导航 + 主内容 + AI 面板<br/>
    ✓ 侧边导航代替底部 Tab<br/>
    ✓ 双列/多列网格展示更多信息<br/>
    ✓ 利用大屏展示图表和 AI 助手<br/>
    <b>响应式断点</b>：≥ 768px 自动切换平板模式
  </div>
</div>

</body>
</html>
