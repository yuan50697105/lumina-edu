      type: object
      properties:
        pq_id:
          type: string
          format: uuid
        question_id:
          type: string
          format: uuid
        order_num:
          type: integer
        score:
          type: number
        qtype:
          type: string
        title:
          type: string
        options:
          type: array
          items: { type: string }
        answer:
          type: array
          items: { type: string }
          description: 学生侧隐藏
        difficulty:
          type: string
        tags:
          type: array
          items: { type: string }
