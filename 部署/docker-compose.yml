version: '3.8'

# Lumina 墨光 - 轻量级部署配置
# 适用场景：初期上线，用户量 < 5000

services:
  # ============================================
  # PostgreSQL 数据库
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: lumina-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lumina}
      POSTGRES_USER: ${POSTGRES_USER:-lumina}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumina_secure_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lumina}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lumina-network

  # ============================================
  # Redis 缓存
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: lumina-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secure_password}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lumina-network

  # ============================================
  # MinIO 对象存储
  # ============================================
  minio:
    image: minio/minio:latest
    container_name: lumina-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secure_password}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lumina-network

  # ============================================
  # 用户服务 (user-service / FastAPI)
  # 认证 + 用户资料 + 监控埋点
  # ============================================
  user-service:
    build: ../服务/user-service
    container_name: lumina-user-service
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER:-lumina}:${POSTGRES_PASSWORD:-lumina_secure_password}@postgres:5432/${POSTGRES_DB:-lumina}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_me_jwt_secret_key}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - lumina-network

  # ============================================
  # 课程服务 (course-service / FastAPI)
  # 课程·章节·选课·公告 + 监控埋点
  # ============================================
  course-service:
    build: ../服务/course-service
    container_name: lumina-course-service
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER:-lumina}:${POSTGRES_PASSWORD:-lumina_secure_password}@postgres:5432/${POSTGRES_DB:-lumina}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_me_jwt_secret_key}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - lumina-network

  # ============================================
  # 作业服务 (assignment-service / FastAPI)
  # 作业·提交·批阅 + 监控埋点
  # ============================================
  assignment-service:
    build: ../服务/assignment-service
    container_name: lumina-assignment-service
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER:-lumina}:${POSTGRES_PASSWORD:-lumina_secure_password}@postgres:5432/${POSTGRES_DB:-lumina}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_me_jwt_secret_key}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8091/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - lumina-network

  # ============================================
  # 成绩服务 (grade-service / FastAPI)
  # 学期成绩汇总·成绩单·统计 + 监控埋点
  # ============================================
  grade-service:
    build: ../服务/grade-service
    container_name: lumina-grade-service
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER:-lumina}:${POSTGRES_PASSWORD:-lumina_secure_password}@postgres:5432/${POSTGRES_DB:-lumina}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_me_jwt_secret_key}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8092/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - lumina-network

  # ============================================
  # Nginx 反向代理（可选）
  # ============================================
  # AI 网关服务 (ai-gateway-service / FastAPI)
  # 模型池·智能路由·用量统计 + 监控埋点
  # ============================================
  ai-gateway-service:
    build: ../服务/ai-gateway-service
    container_name: lumina-ai-gateway
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER:-lumina}:${POSTGRES_PASSWORD:-lumina_secure_password}@postgres:5432/${POSTGRES_DB:-lumina}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_me_jwt_secret_key}
      # 模型供应商 API Key（可选，配置后可用于统一调用 /gateway/completions）
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      GLM_API_KEY: ${GLM_API_KEY:-}
      SPARK_API_KEY: ${SPARK_API_KEY:-}
      DOUBAO_API_KEY: ${DOUBAO_API_KEY:-}
      BCE_API_KEY: ${BCE_API_KEY:-}
      MOONSHOT_API_KEY: ${MOONSHOT_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8093/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - lumina-network

  # ============================================
  # AI 对话服务 (ai-chat-service / FastAPI)
  # 苏格拉底导师 · SSE 流式对话 · 会话管理
  # 消费 ai-gateway 统一调用（透传用户 JWT，不需厂商 Key）
  # ============================================
  ai-chat-service:
    build: ../服务/ai-chat-service
    container_name: lumina-ai-chat
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER:-lumina}:${POSTGRES_PASSWORD:-lumina_secure_password}@postgres:5432/${POSTGRES_DB:-lumina}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_me_jwt_secret_key}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      AI_GATEWAY_URL: http://ai-gateway-service:8093
    depends_on:
      postgres:
        condition: service_healthy
      ai-gateway-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8094/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - lumina-network

  # ============================================
  # AI 批阅服务 (ai-grade-service / FastAPI)
  # AI 辅助批阅 · 结构化成绩 · 写 grades 表
  # 消费 ai-gateway 统一调用（透传用户 JWT）
  # ============================================
  ai-grade-service:
    build: ../服务/ai-grade-service
    container_name: lumina-ai-grade
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER:-lumina}:${POSTGRES_PASSWORD:-lumina_secure_password}@postgres:5432/${POSTGRES_DB:-lumina}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_me_jwt_secret_key}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      AI_GATEWAY_URL: http://ai-gateway-service:8093
    depends_on:
      postgres:
        condition: service_healthy
      ai-gateway-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8095/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - lumina-network

  # ============================================
  # 埋点收集服务 (analytics-service / FastAPI)
  # 事件收集(event_tracking) · 批量导入 · 统计查询
  # ============================================
  analytics-service:
    build: ../服务/analytics-service
    container_name: lumina-analytics
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DATABASE_URL: postgresql://${POSTGRES_USER:-lumina}:${POSTGRES_PASSWORD:-lumina_secure_password}@postgres:5432/${POSTGRES_DB:-lumina}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change_me_jwt_secret_key}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8096/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - lumina-network

  # ============================================
  nginx:
    image: nginx:alpine
    container_name: lumina-nginx
    restart: unless-stopped
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ../原型:/usr/share/nginx/html:ro
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      - minio
      - user-service
      - course-service
      - assignment-service
      - grade-service
      - ai-gateway-service
      - ai-chat-service
      - ai-grade-service
      - analytics-service
    networks:
      - lumina-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  lumina-network:
    driver: bridge
