openapi: 3.1.0
info:
  title: Lumina 墨光 · 跨端教学协作平台 API
  description: 用户·课程·作业·成绩·AI 对话·批阅·埋点·日志 全链路 API
  version: 1.0.0
paths:
  /health:
    get:
      summary: 健康检查
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /health/ready:
    get:
      summary: 就绪检查
      operationId: ready_health_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/auth/register:
    post:
      tags:
      - 认证
      summary: 注册（学生/教师自助开户）
      description: 学生/教师自助注册并自动登录；管理员角色禁止自助开通
      operationId: register_api_v1_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/login:
    post:
      tags:
      - 认证
      summary: 登录
      description: 用户名密码登录，发放双令牌并记录会话
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/refresh:
    post:
      tags:
      - 认证
      summary: 刷新令牌
      description: 用刷新令牌换取新的双令牌
      operationId: refresh_api_v1_auth_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/logout:
    post:
      tags:
      - 认证
      summary: 退出登录
      description: 删除当前会话并记录退出埋点
      operationId: logout_api_v1_auth_logout_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
      security:
      - HTTPBearer: []
  /api/v1/auth/password:
    post:
      tags:
      - 认证
      summary: 修改密码
      description: 修改当前用户密码
      operationId: change_password_api_v1_auth_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/users/me:
    get:
      tags:
      - 用户
      summary: 获取当前用户资料
      operationId: get_me_api_v1_users_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
      security:
      - HTTPBearer: []
    patch:
      tags:
      - 用户
      summary: 更新当前用户资料
      description: 更新昵称 / 头像 / 简介
      operationId: update_me_api_v1_users_me_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/users/{user_id}:
    get:
      tags:
      - 用户
      summary: 获取用户公开资料
      description: 获取其他用户资料（学生可见，用于协作）
      operationId: get_user_api_v1_users__user_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - 用户
      summary: 删除用户（管理员）
      description: 管理员删除用户
      operationId: delete_user_api_v1_users__user_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/users:
    get:
      tags:
      - 用户
      summary: 用户列表（管理员）
      description: 管理员分页获取用户列表
      operationId: list_users_api_v1_users_get
      security:
      - HTTPBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserOut'
                title: Response List Users Api V1 Users Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/users/batch/import:
    post:
      tags:
      - 用户
      summary: 批量导入用户（管理员 · ≤500）
      description: 批量导入：每行生成默认密码（或指定密码）的 hash，冲突邮箱/学号跳过并记录错误
      operationId: batch_import_users_api_v1_users_batch_import_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchImportIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResultOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/users/batch/update:
    post:
      tags:
      - 用户
      summary: 批量更新用户角色（管理员）
      description: 批量修改角色（不能把管理员降权为自己的依赖保护）
      operationId: batch_update_users_api_v1_users_batch_update_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchUpdateIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResultOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/users/batch/toggle:
    post:
      tags:
      - 用户
      summary: 批量启用/禁用用户（管理员 · 注销会话）
      description: 'V1：通过清除 refresh token 实现禁用（sessions 表 CASCADE）。

        启用时仅允许登录时重新生成，无需额外状态字段。'
      operationId: batch_toggle_users_api_v1_users_batch_toggle_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchToggleIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResultOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/courses:
    get:
      tags:
      - 课程
      summary: 课程列表
      description: 课程列表，支持学期 / 院系筛选，分页返回
      operationId: list_courses_api_v1_courses_get
      security:
      - HTTPBearer: []
      parameters:
      - name: semester
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Semester
      - name: department
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Department
      - name: status_filter
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status Filter
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response List Courses Api V1 Courses Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - 课程
      summary: 创建课程（教师）
      operationId: create_course_api_v1_courses_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/courses/me/enrolled:
    get:
      tags:
      - 课程
      summary: 我的课程（当前用户）
      description: 当前用户的课程：学生=已选，教师=开设
      operationId: my_courses_api_v1_courses_me_enrolled_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/EnrollmentOut'
                type: array
                title: Response My Courses Api V1 Courses Me Enrolled Get
      security:
      - HTTPBearer: []
  /api/v1/courses/{course_id}:
    get:
      tags:
      - 课程
      summary: 课程详情
      operationId: get_course_api_v1_courses__course_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: course_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Course Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - 课程
      summary: 更新课程（教师/管理员）
      operationId: update_course_api_v1_courses__course_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: course_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Course Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/courses/{course_id}/chapters:
    get:
      tags:
      - 课程
      summary: 章节列表
      operationId: list_chapters_api_v1_courses__course_id__chapters_get
      security:
      - HTTPBearer: []
      parameters:
      - name: course_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Course Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChapterOut'
                title: Response List Chapters Api V1 Courses  Course Id  Chapters
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - 课程
      summary: 新增章节（教师）
      operationId: create_chapter_api_v1_courses__course_id__chapters_post
      security:
      - HTTPBearer: []
      parameters:
      - name: course_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Course Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChapterCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/courses/{course_id}/chapters/{chapter_id}:
    patch:
      tags:
      - 课程
      summary: 更新章节（教师）
      operationId: update_chapter_api_v1_courses__course_id__chapters__chapter_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: course_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Course Id
      - name: chapter_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Chapter Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChapterUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - 课程
      summary: 删除章节（教师）
      operationId: delete_chapter_api_v1_courses__course_id__chapters__chapter_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: course_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Course Id
      - name: chapter_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Chapter Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/courses/{course_id}/enroll:
    post:
      tags:
      - 课程
      summary: 选课（学生）
      operationId: enroll_api_v1_courses__course_id__enroll_post
      security:
      - HTTPBearer: []
      parameters:
      - name: course_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Course Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - 课程
      summary: 退课（学生）
      operationId: drop_api_v1_courses__course_id__enroll_delete
      security:
      - HTTPBearer: []
      parameters:
      - name: course_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Course Id
      responses:
        '200':
          description: Successful Response
          content:
