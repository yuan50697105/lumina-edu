    # ═══════ 题库与考试 EXAM（D-04）═══════
    QuestionBody:
      type: object
      required: [qtype, title]
      properties:
        qtype:
          type: string
          enum: [single, multiple, true_false, short_answer]
        title:
          type: string
        options:
          type: array
          items: { type: string }
          description: 客观题选项（single/multiple/true_false 必填）
        answer:
          type: array
          items: { type: string }
          description: 正确答案（short_answer 保存参考答案文本）
        score:
          type: number
          default: 5
        difficulty:
          type: string
          enum: [easy, medium, hard]
          default: medium
        tags:
          type: array
          items: { type: string }
        chapter_id:
          type: string
          format: uuid
          nullable: true
    QuestionOut:
      type: object
      allOf:
        - $ref: '#/components/schemas/QuestionBody'
        - type: object
          properties:
            id:
              type: string
              format: uuid
            course_id:
              type: string
              format: uuid
            created_by:
              type: string
              format: uuid
            created_by_name:
              type: string
            created_at:
              type: string
              format: date-time
            answer_hidden:
              type: boolean
              description: 学生侧 answer 置空
    PaperBody:
      type: object
      required: [title]
      properties:
        title:
          type: string
        description:
          type: string
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        duration_minutes:
          type: integer
          default: 60
    PaperOut:
      type: object
      required: [id, course_id, title, total_score, status]
      properties:
        id:
          type: string
          format: uuid
        course_id:
          type: string
          format: uuid
        course_title:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        start_at:
          type: string
          format: date-time
          nullable: true
        end_at:
          type: string
          format: date-time
          nullable: true
        duration_minutes:
          type: integer
        total_score:
          type: number
        status:
          type: string
          enum: [draft, published, closed]
        question_count:
          type: integer
        questions:
          type: array
          items: { $ref: '#/components/schemas/PaperQuestionOut' }
        my_attempt:
          type: object
          description: 学生侧当前用户状态（in_progress/submitted），教师无
          properties:
            status:
              type: string
              enum: [in_progress, submitted]
        created_at:
          type: string
          format: date-time
    PaperQuestionIn:
      type: object
      required: [question_id]
      properties:
        question_id:
